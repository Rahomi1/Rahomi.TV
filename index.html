<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #020617;
}

body {

  font-family: 'Cairo', sans-serif;

  min-height: 100vh;

  color: #f8fafc;

  padding-top: 20px;
  padding-bottom: 20px;

  display: flex;
  flex-direction: column;
  align-items: center;

  -webkit-user-select: none;
  user-select: none;

  overflow-x: hidden;
}

.title-font {
  font-family: 'Changa', sans-serif;
}

.glass {

  background: rgba(15,23,42,0.92);

  border: 1px solid rgba(148,163,184,0.2);

  backdrop-filter: blur(10px);

  -webkit-backdrop-filter: blur(10px);
}

.login-card {

  background: rgba(15,23,42,0.97);

  border: 1px solid rgba(148,163,184,0.2);
}

input:focus {

  border-color: #38bdf8;

  box-shadow:
    0 0 0 3px rgba(56,189,248,0.25);
}

.channel-card-clickable {

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease;

  cursor: pointer;
}

.channel-card-clickable:hover {

  transform: translateY(-2px);

  box-shadow:
    0 0 25px rgba(56,189,248,0.25);

  border-color:
    rgba(56,189,248,0.5);
}

.channel-card-active {

  box-shadow:
    0 0 22px rgba(56,189,248,0.55);

  background:
    radial-gradient(
      circle at 0% 0%,
      rgba(56,189,248,0.16),
      rgba(15,23,42,0.94)
    );

  border-color:
    #38bdf8 !important;
}

.server-button-active {

  background-color:
    #0c4a6e;

  border-color:
    #38bdf8;

  box-shadow:
    0 0 7px rgba(56,189,248,0.5);
}


/* =====================================================
   PLAYER
   ===================================================== */

#playerContainer {

  position: relative;

  overflow: hidden;

  background: #000;

  aspect-ratio: 16 / 9;

  width: 100%;

  border-radius: 14px;

  border: 1px solid rgba(148,163,184,0.18);

  box-shadow:
    inset 0 0 30px rgba(0,0,0,.7),
    0 10px 40px rgba(0,0,0,.35);

  isolation: isolate;
}

#videoPlayer {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  background: #000;

  object-fit: contain;

  outline: none;

  border: 0;
}

#videoPlayer::-webkit-media-controls {
  display: none !important;
}

#videoPlayer::-webkit-media-controls-enclosure {
  display: none !important;
}


/* =====================================================
   PLAYER OVERLAY
   ===================================================== */

.player-overlay {

  position: absolute;

  inset: 0;

  z-index: 10;

  pointer-events: none;
}


/* =====================================================
   LOADING
   ===================================================== */

.player-loading {

  position: absolute;

  inset: 0;

  z-index: 30;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  background:
    rgba(0,0,0,.40);

  pointer-events: none;

  opacity: 0;

  transition:
    opacity .2s ease;
}

.player-loading.visible {
  opacity: 1;
}

.loading-spinner {

  width: 42px;

  height: 42px;

  border-radius: 50%;

  border:
    3px solid rgba(255,255,255,.15);

  border-top-color:
    #38bdf8;

  animation:
    spin .75s linear infinite;
}

.loading-text {

  margin-top: 10px;

  font-size: 12px;

  color: #e2e8f0;

  text-shadow:
    0 1px 4px #000;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }
}


/* =====================================================
   TOP LIVE
   ===================================================== */

.player-top-status {

  position: absolute;

  top: 12px;

  left: 12px;

  right: 12px;

  display: flex;

  align-items: center;

  justify-content: flex-start;

  pointer-events: none;

  text-shadow:
    0 1px 5px #000;
}

.live-badge {

  display: flex;

  align-items: center;

  gap: 6px;

  padding:
    4px 9px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.55);

  backdrop-filter:
    blur(5px);

  font-size: 11px;

  font-weight: 700;
}


/* =====================================================
   LIVE DOT - RED
   ===================================================== */

.live-dot {

  width: 8px;

  height: 8px;

  border-radius: 50%;

  background: #ef4444;

  box-shadow:
    0 0 9px rgba(239,68,68,.9);

  animation:
    livePulse 1.5s infinite;
}

@keyframes livePulse {

  0%,
  100% {
    opacity: 1;
  }

  50% {
    opacity: .45;
  }
}


/* =====================================================
   SINGLE PROGRESS BAR
   ===================================================== */

.player-bottom {

  position: absolute;

  left: 12px;

  right: 12px;

  bottom: 10px;

  z-index: 25;
}

.progress-info {

  display: flex;

  justify-content: flex-start;

  align-items: center;

  margin-bottom: 5px;

  font-size: 10px;

  font-weight: 700;

  color: #e2e8f0;

  text-shadow:
    0 1px 4px #000;
}

.progress-track {

  width: 100%;

  height: 6px;

  border-radius: 999px;

  background:
    rgba(255,255,255,.22);

  overflow: hidden;

  box-shadow:
    0 1px 5px rgba(0,0,0,.5);
}

#bufferProgress {

  height: 100%;

  width: 0%;

  border-radius: 999px;

  background:
    #38bdf8;

  box-shadow:
    0 0 10px rgba(56,189,248,.85);

  transition:
    width .35s ease,
    background .25s ease;
}


/* =====================================================
   PLAYER BUTTONS
   ===================================================== */

.player-buttons {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-top: 8px;

  pointer-events: auto;
}

.player-buttons-right,
.player-buttons-left {

  display: flex;

  align-items: center;

  gap: 6px;
}

.player-btn {

  width: 34px;

  height: 30px;

  border: 0;

  border-radius: 8px;

  background:
    rgba(0,0,0,.58);

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

  cursor: pointer;

  transition:
    background .2s ease,
    transform .2s ease;
}

.player-btn:hover {

  background:
    rgba(14,165,233,.65);

  transform: scale(1.04);
}

.player-btn:active {
  transform: scale(.95);
}


/* =====================================================
   FULLSCREEN
   ===================================================== */

#playerContainer:fullscreen {

  width: 100vw;

  height: 100vh;

  max-width: none;

  aspect-ratio: auto;

  border: 0;

  border-radius: 0;

  background: #000;
}

#playerContainer:-webkit-full-screen {

  width: 100vw;

  height: 100vh;

  border: 0;

  border-radius: 0;

  background: #000;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 768px) {

  body {
    padding-top: 8px;
    padding-bottom: 8px;
  }

  #playerContainer {
    border-radius: 10px;
  }

  .player-bottom {
    left: 8px;
    right: 8px;
    bottom: 7px;
  }

  .player-top-status {
    top: 8px;
    left: 8px;
    right: 8px;
  }

}


/* =====================================================
   LOGO
   ===================================================== */

.channel-logo-container {

  position: relative;

  width: 44px;

  height: 44px;

  flex-shrink: 0;

  border-radius: 9px;

  overflow: hidden;

  background:
    rgba(14,165,233,.12);

  border:
    1px solid rgba(56,189,248,.4);

  display: flex;

  align-items: center;

  justify-content: center;
}

.channel-logo-image {

  width: 100%;

  height: 100%;

  object-fit: cover;
}


/* =====================================================
   HIDE
   ===================================================== */

.hidden {
  display: none !important;
}

</style>

</head>

<script>

/* =====================================================
   BASIC PROTECTION
   ===================================================== */

document.onkeydown = function(e) {

  if (
    e.key === "F12" ||

    (e.ctrlKey &&
      e.shiftKey &&
      (
        e.key === "I" ||
        e.key === "C" ||
        e.key === "J"
      )
    ) ||

    (e.ctrlKey &&
      e.key === "U")
  ) {

    e.preventDefault();

    return false;
  }

  if (
    e.ctrlKey &&
    (
      e.key === "c" ||
      e.key === "x"
    )
  ) {

    e.preventDefault();
  }

};

document.addEventListener(
  "contextmenu",
  e => e.preventDefault()
);

document.addEventListener(
  "selectstart",
  e => e.preventDefault()
);

document.addEventListener(
  "copy",
  e => e.preventDefault()
);

document.addEventListener(
  "cut",
  e => e.preventDefault()
);

</script>

<script>

/* =====================================================
   GLOBAL PLAYER STATE
   ===================================================== */

let hlsInstance = null;

let bufferTimer = null;

let healthTimer = null;

let retryTimer = null;

let retryCount = 0;

let playerGeneration = 0;

let currentStreamUrl = "";

let currentChannelId = null;

let currentChannelName = "";

let currentVideo = null;

let isRecovering = false;


/* =====================================================
   LOGIN
   ===================================================== */

const CORRECT_CODE = "1212";

let isLoggedIn = true;


/* =====================================================
   CHANNELS
   ===================================================== */

const CHANNELS = {

  server1: [

    {
      id: 1,
      name: "Bein Sport 1",
      url: "https://yac.rhomyrhomyy.workers.dev/stream/1424",
      color: "sky",
      logoUrl: "https://e.top4top.io/p_3613wsbdl0.jpg"
    },

    {
      id: 2,
      name: "Bein Sport 2",
      url: "https://yac.rhomyrhomyy.workers.dev/stream/1425",
      color: "sky",
      logoUrl: "https://e.top4top.io/p_3613wsbdl0.jpg"
    },

    {
      id: 3,
      name: "Bein Sport 3",
      url: "https://yac.rhomyrhomyy.workers.dev/stream/1426",
      color: "sky",
      logoUrl: "https://e.top4top.io/p_3613wsbdl0.jpg"
    },

    {
      id: 4,
      name: "Bein Sport 4",
      url: "https://yac.rhomyrhomyy.workers.dev/stream/1427",
      color: "sky",
      logoUrl: "https://e.top4top.io/p_3613wsbdl0.jpg"
    },

    {
      id: 5,
      name: "Bein Sport 5",
      url: "https://yac.rhomyrhomyy.workers.dev/stream/1428",
      color: "sky",
      logoUrl: "https://e.top4top.io/p_3613wsbdl0.jpg"
    },

    {
      id: 6,
      name: "العراقية الرياضية",
      url: "https://imn-live.esite-lab.com/hls/iraqia-sports-1.m3u8",
      color: "sky",
      logoUrl: "https://e.top4top.io/p_3613wsbdl0.jpg"
    }

  ]

};


let activeServer = "server1";


/* =====================================================
   CREATE CHANNEL CARD
   ===================================================== */

function createChannelCard(channel) {

  const fallbackSvg = `
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-6 h-6 text-sky-300"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >

      <rect
        x="2"
        y="7"
        width="20"
        height="15"
        rx="2"
      ></rect>

      <polyline
        points="17 2 12 7 7 2"
      ></polyline>

    </svg>
  `;


  let logoContent = fallbackSvg;


  if (
    channel.logoUrl &&
    channel.logoUrl.trim() !== ""
  ) {

    logoContent = `
      <img
        src="${channel.logoUrl}"
        alt=""
        class="channel-logo-image"
        onerror="
          this.onerror=null;
          this.parentElement.innerHTML=this.parentElement.dataset.fallback;
        "
      >
    `;
  }


  return `

    <div
      onclick="playChannel(
        ${channel.id},
        '${channel.url}',
        '${channel.name.replace(/'/g, "\\'")}'
      )"

      class="
        channel-card-clickable
        glass
        rounded-xl
        p-3
        border
        border-slate-700/80
        bg-slate-900/50
      "

      data-id="${channel.id}"
    >

      <div class="flex items-center gap-3">

        <div
          class="channel-logo-container"
          data-fallback='${fallbackSvg}'
        >

          ${logoContent}

        </div>

        <div
          class="
            flex
            flex-col
            flex-1
            min-w-0
          "
        >

          <span
            class="
              font-semibold
              text-base
              text-slate-50
              truncate
            "
          >
            ${channel.name}
          </span>

          <span
            class="
              text-[10px]
              text-slate-500
            "
          >
            بث مباشر
          </span>

        </div>

      </div>

    </div>

  `;
}


/* =====================================================
   SWITCH SERVER
   ===================================================== */

function switchServer(serverId) {

  if (!CHANNELS[serverId]) return;

  activeServer = serverId;


  document
    .querySelectorAll(".server-button")
    .forEach(btn => {

      btn.classList.remove(
        "server-button-active"
      );

      if (
        btn.dataset.serverId === serverId
      ) {

        btn.classList.add(
          "server-button-active"
        );
      }

    });


  const container =
    document.getElementById(
      "channelList"
    );


  container.innerHTML = "";


  CHANNELS[serverId].forEach(
    channel => {

      container.innerHTML +=
        createChannelCard(channel);

    }
  );


  destroyPlayer();

  restorePlaceholder();

}


/* =====================================================
   PLACEHOLDER
   ===================================================== */

function restorePlaceholder() {

  const container =
    document.getElementById(
      "playerContainer"
    );


  container.innerHTML = `

    <div
      id="playerPlaceholder"
      class="
        flex
        flex-col
        items-center
        gap-3
        px-4
        text-center
      "
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-10 h-10 text-sky-300"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >

        <circle
          cx="12"
          cy="12"
          r="9"
          stroke-width="1.4"
        ></circle>

        <path
          d="M10 9.5v5l4-2.5-4-2.5z"
          fill="currentColor"
          stroke="none"
        ></path>

      </svg>

      <div class="space-y-1">

        <p
          class="
            font-semibold
            text-slate-100
          "
        >
          اضغط على اسم القناة لبدء المشاهدة.
        </p>

        <p
          class="
            text-sm
            text-slate-400
          "
        >

          القناة الحالية:

          <span
            id="currentChannelLabel"
            class="
              font-semibold
              text-sky-300
            "
          >
            لم يتم الاختيار
          </span>

        </p>

      </div>

    </div>
  `;


  const label =
    document.getElementById(
      "currentChannelLabel"
    );


  if (label) {

    label.textContent =
      "لم يتم الاختيار";

  }

}


/* =====================================================
   DESTROY PLAYER
   ===================================================== */

function destroyPlayer() {

  playerGeneration++;

  isRecovering = false;


  if (bufferTimer) {

    clearInterval(
      bufferTimer
    );

    bufferTimer = null;

  }


  if (healthTimer) {

    clearInterval(
      healthTimer
    );

    healthTimer = null;

  }


  if (retryTimer) {

    clearTimeout(
      retryTimer
    );

    retryTimer = null;

  }


  if (hlsInstance) {

    try {
      hlsInstance.stopLoad();
    } catch (e) {}

    try {
      hlsInstance.detachMedia();
    } catch (e) {}

    try {
      hlsInstance.destroy();
    } catch (e) {}

    hlsInstance = null;

  }


  currentVideo = null;

  currentStreamUrl = "";

  retryCount = 0;

}

function setLoading(

) {

    );

  else {

/* =====================================================
   BUFFER MONITOR
   ===================================================== */

function startBufferMonitor(
  video,
  generation
) {

  if (bufferTimer) {

    clearInterval(
      bufferTimer
    );

  }


  bufferTimer =
    setInterval(
      function() {

        if (
          generation !==
          playerGeneration
        ) {

          clearInterval(
            bufferTimer
          );

          return;

        }


        if (
          !video ||
          video.readyState < 2
        ) {

          return;

        }


        let bufferedSeconds = 0;


        try {

          const currentTime =
            video.currentTime;

          const ranges =
            video.buffered;


          for (
            let i = 0;
            i < ranges.length;
            i++
          ) {

            const start =
              ranges.start(i);

            const end =
              ranges.end(i);


            if (
              currentTime >= start &&
              currentTime <= end
            ) {

              bufferedSeconds =
                Math.max(
                  0,
                  end - currentTime
                );

              break;

            }

          }

        } catch (e) {}


        const seconds =
          Math.round(
            bufferedSeconds
          );


        const text =
          document.getElementById(
            "bufferText"
          );


        const progress =
          document.getElementById(
            "bufferProgress"
          );


        if (text) {

          text.textContent =
            `Buffer: ${seconds}s`;

        }


        if (progress) {

          /*
             الشريط يمثل حتى 30 ثانية
          */

          const percent =
            Math.min(
              100,
              (bufferedSeconds / 30) * 100
            );


          progress.style.width =
            percent + "%";


          if (
            bufferedSeconds < 2
          ) {

            progress.style.background =
              "#ef4444";

          }

          else if (
            bufferedSeconds < 5
          ) {

            progress.style.background =
              "#f59e0b";

          }

          else {

            progress.style.background =
              "#38bdf8";

          }

        }


      },
      500
    );

}


/* =====================================================
   VIDEO EVENTS
   ===================================================== */

function attachVideoEvents(
  video
) {

  if (!video) return;


  video.addEventListener(
    "playing",
    function() {

      setLoading(false);


      const button =
        document.getElementById(
          "playButton"
        );


      if (button) {

        button.textContent =
          "Ⅱ";

      }

    }
  );


  video.addEventListener(
    "pause",
    function() {

      const button =
        document.getElementById(
          "playButton"
        );


      if (button) {

        button.textContent =
          "▶";

      }

    }
  );


  video.addEventListener(
    "waiting",
    function() {

      setLoading(
        true,
        "تثبيت البث..."
      );


      silentRecovery(
        "waiting"
      );

    }
  );


  video.addEventListener(
    "stalled",
    function() {

      setLoading(
        true,
        "إعادة تثبيت البث..."
      );


      silentRecovery(
        "stalled"
      );

    }
  );


  video.addEventListener(
    "error",
    function() {

      silentRecovery(
        "video-error"
      );

    }
  );


  video.addEventListener(
    "canplay",
    function() {

      if (
        video.paused === false
      ) {

        setLoading(false);

      }

    }
  );


  video.addEventListener(
    "timeupdate",
    function() {

      if (
        !video.paused &&
        video.readyState >= 3
      ) {

        isRecovering = false;

      }

    }
  );

}


/* =====================================================
   HLS CONFIG
   ===================================================== */

function createHls() {

  return new Hls({

    debug: false,

    enableWorker: true,

    lowLatencyMode: false,

    capLevelToPlayerSize: true,

    startLevel: -1,


    maxBufferLength: 30,

    maxMaxBufferLength: 60,

    backBufferLength: 30,


    liveSyncDurationCount: 4,

    liveMaxLatencyDurationCount: 12,

    maxLiveSyncPlaybackRate: 1.05,


    abrEwmaFastLive: 3,

    abrEwmaSlowLive: 9,

    abrBandWidthFactor: 0.75,

    abrBandWidthUpFactor: 0.70,


    manifestLoadingMaxRetry: 8,

    manifestLoadingRetryDelay: 1000,

    manifestLoadingMaxRetryTimeout: 10000,


    levelLoadingMaxRetry: 8,

    levelLoadingRetryDelay: 1000,

    levelLoadingMaxRetryTimeout: 10000,


    fragLoadingMaxRetry: 10,

    fragLoadingRetryDelay: 1000,

    fragLoadingMaxRetryTimeout: 10000,


    maxFragLookUpTolerance: 0.25,

    maxLoadingDelay: 4

  });

}


/* =====================================================
   PLAY CHANNEL
   ===================================================== */

function playChannel(
  id,
  url,
  name
) {

  if (
    !url ||
    url.trim() === ""
  ) {

    return;

  }


  destroyPlayer();


  currentStreamUrl =
    url;

  currentChannelId =
    id;

  currentChannelName =
    name;

  retryCount = 0;

  isRecovering = false;


  const label =
    document.getElementById(
      "currentChannelLabel"
    );


  if (label) {

    label.textContent =
      name;

  }


  document
    .querySelectorAll(
      ".channel-card-clickable"
    )
    .forEach(card => {

      card.classList.remove(
        "channel-card-active"
      );

    });


  const card =
    Array.from(
      document.querySelectorAll(
        ".channel-card-clickable"
      )
    ).find(
      el =>
        el.dataset.id == id
    );


  if (card) {

    card.classList.add(
      "channel-card-active"
    );

  }


  createPlayerUI();


  const video =
    document.getElementById(
      "videoPlayer"
    );


  if (!video) return;


  const generation =
    playerGeneration;


  setLoading(
    true,
    "جاري الاتصال بالبث..."
  );


  /*
     HLS.JS
  */

  if (
    Hls.isSupported()
  ) {

    hlsInstance =
      createHls();


    hlsInstance.attachMedia(
      video
    );


    hlsInstance.on(
      Hls.Events.MEDIA_ATTACHED,
      function() {

        if (
          generation !==
          playerGeneration
        ) return;


        hlsInstance.loadSource(
          currentStreamUrl
        );

      }
    );


    hlsInstance.on(
      Hls.Events.MANIFEST_PARSED,
      function() {

        if (
          generation !==
          playerGeneration
        ) return;


        retryCount = 0;


        setLoading(false);


        startBufferMonitor(
          video,
          generation
        );


        video
          .play()
          .then(
            function() {

              setLoading(false);

              requestFullscreenAndLandscape();

            }
          )
          .catch(
            function() {

              setLoading(false);

            }
          );

      }
    );


    hlsInstance.on(
      Hls.Events.FRAG_LOADED,
      function() {

        if (
          video.readyState >= 3
        ) {

          setLoading(false);

          isRecovering = false;

        }

      }
    );


    hlsInstance.on(
      Hls.Events.BUFFER_APPENDED,
      function() {

        if (
          video.readyState >= 3 &&
          !video.paused
        ) {

          setLoading(false);

        }

      }
    );


    hlsInstance.on(
      Hls.Events.ERROR,
      function(
        event,
        data
      ) {

        if (
          generation !==
          playerGeneration
        ) return;


        if (
          data.fatal &&
          data.type ===
          Hls.ErrorTypes.NETWORK_ERROR
        ) {

          silentHlsRecovery(
            "network"
          );

          return;

        }


        if (
          data.fatal &&
          data.type ===
          Hls.ErrorTypes.MEDIA_ERROR
        ) {

          silentMediaRecovery();

          return;

        }


        if (
          data.fatal
        ) {

          silentFullRecovery();

        }

      }
    );

  }


  /*
     Native HLS
  */

  else if (
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    video.src =
      currentStreamUrl;


    video.addEventListener(
      "loadedmetadata",
      function() {

        if (
          generation !==
          playerGeneration
        ) return;


        setLoading(false);


        startBufferMonitor(
          video,
          generation
        );


        video
          .play()
          .then(
            function() {

              requestFullscreenAndLandscape();

            }
          )
          .catch(
            function() {}
          );

      }
    );

  }

  else {

    setLoading(false);

    return;

  }


  startHealthMonitor(
    video,
    generation
  );

}


/* =====================================================
   HLS RECOVERY
   ===================================================== */

function silentHlsRecovery(
  reason
) {

  if (
    isRecovering
  ) return;


  isRecovering = true;


  setLoading(
    true,
    "تثبيت البث..."
  );


  if (
    hlsInstance
  ) {

    try {

      hlsInstance.startLoad();

    } catch (e) {}

  }


  setTimeout(
    function() {

      isRecovering = false;

    },
    2500
  );

}


/* =====================================================
   MEDIA RECOVERY
   ===================================================== */

function silentMediaRecovery() {

  if (
    isRecovering
  ) return;


  isRecovering = true;


  setLoading(
    true,
    "إصلاح البث..."
  );


  if (
    hlsInstance
  ) {

    try {

      hlsInstance.recoverMediaError();

    } catch (e) {

      silentFullRecovery();

      return;

    }

  }


  setTimeout(
    function() {

      isRecovering = false;

    },
    3000
  );

}


/* =====================================================
   FULL RECOVERY
   ===================================================== */

function silentFullRecovery() {

  if (
    retryTimer
  ) return;


  const generation =
    playerGeneration;


  retryCount++;


  const delay =
    Math.min(
      15000,
      1000 *
      Math.pow(
        1.5,
        Math.min(
          retryCount - 1,
          6
        )
      )
    );


  setLoading(
    true,
    "إعادة الاتصال بالبث..."
  );


  retryTimer =
    setTimeout(
      function() {

        retryTimer = null;


        if (
          generation !==
          playerGeneration
        ) return;


        const oldVideo =
          currentVideo;


        if (
          oldVideo
        ) {

          try {
            oldVideo.pause();
          } catch (e) {}

        }


        if (
          hlsInstance
        ) {

          try {

            hlsInstance.destroy();

          } catch (e) {}

          hlsInstance = null;

        }


        if (
          Hls.isSupported() &&
          currentStreamUrl
        ) {

          const video =
            document.getElementById(
              "videoPlayer"
            );


          if (!video) return;


          hlsInstance =
            createHls();


          hlsInstance.attachMedia(
            video
          );


          hlsInstance.on(
            Hls.Events.MEDIA_ATTACHED,
            function() {

              hlsInstance.loadSource(
                currentStreamUrl
              );

            }
          );


          hlsInstance.on(
            Hls.Events.MANIFEST_PARSED,
            function() {

              retryCount = 0;


              setLoading(
                false
              );


              try {

                video.play();

              } catch (e) {}


              isRecovering = false;

            }
          );


          hlsInstance.on(
            Hls.Events.ERROR,
            function(
              event,
              data
            ) {

              if (
                data.fatal
              ) {

                isRecovering = false;

                silentFullRecovery();

              }

            }
          );

        }

      },
      delay
    );

}


/* =====================================================
   WAITING / STALLED
   ===================================================== */

function silentRecovery(
  reason
) {

  if (
    isRecovering
  ) return;


  isRecovering = true;


  if (
    hlsInstance
  ) {

    try {

      hlsInstance.startLoad();

    } catch (e) {}

  }


  setTimeout(
    function() {

      if (
        !currentVideo
      ) return;


      if (
        currentVideo.readyState < 3
      ) {

        isRecovering = false;

        silentFullRecovery();

      }

      else {

        isRecovering = false;

        setLoading(false);

      }

    },
    3500
  );

}


/* =====================================================
   HEALTH MONITOR
   ===================================================== */

function startHealthMonitor(
  video,
  generation
) {

  if (
    healthTimer
  ) {

    clearInterval(
      healthTimer
    );

  }


  let lastTime =
    -1;

  let stuckCounter =
    0;


  healthTimer =
    setInterval(
      function() {

        if (
          generation !==
          playerGeneration
        ) {

          clearInterval(
            healthTimer
          );

          return;

        }


        if (
          !video
        ) return;


        if (
          video.paused
        ) {

          stuckCounter = 0;

          return;

        }


        const currentTime =
          video.currentTime;


        if (
          currentTime ===
          lastTime
        ) {

          stuckCounter++;

        }

        else {

          stuckCounter = 0;

        }


        lastTime =
          currentTime;


        if (
          stuckCounter >= 5
        ) {

          stuckCounter = 0;

          silentRecovery(
            "health"
          );

        }


        if (
          hlsInstance &&
          hlsInstance.liveSyncPosition
        ) {

          const live =
            hlsInstance.liveSyncPosition;


          const delay =
            live -
            video.currentTime;


          if (
            delay > 25
          ) {

            try {

              video.currentTime =
                live - 3;

            } catch (e) {}

          }

        }

      },
      1000
    );

}


/* =====================================================
   PLAY / PAUSE
   ===================================================== */

function togglePlay() {

  if (
    !currentVideo
  ) return;


  if (
    currentVideo.paused
  ) {

    currentVideo
      .play()
      .catch(
        () => {}
      );

  }

  else {

    currentVideo.pause();

  }

}


/* =====================================================
   MUTE
   ===================================================== */

function mutePlayer() {

  if (
    !currentVideo
  ) return;


  currentVideo.muted =
    !currentVideo.muted;


  const btn =
    document.getElementById(
      "muteButton"
    );


  if (btn) {

    btn.textContent =
      currentVideo.muted
        ? "🔇"
        : "🔊";

  }

}


/* =====================================================
   GO LIVE
   ===================================================== */

function goLive() {

  if (
    !currentVideo
  ) return;


  try {

    if (
      hlsInstance &&
      hlsInstance.liveSyncPosition
    ) {

      currentVideo.currentTime =
        hlsInstance.liveSyncPosition - 2;

    }

    else if (
      currentVideo.seekable.length
    ) {

      currentVideo.currentTime =
        currentVideo.seekable.end(
          currentVideo.seekable.length - 1
        ) - 2;

    }

  } catch (e) {}


  currentVideo
    .play()
    .catch(
      () => {}
    );

}


/* =====================================================
   FULLSCREEN
   ===================================================== */

async function requestFullscreenAndLandscape() {

  const container =
    document.getElementById(
      "playerContainer"
    );


  if (!container) return;


  try {

    if (
      !document.fullscreenElement
    ) {

      if (
        container.requestFullscreen
      ) {

        await container.requestFullscreen();

      }

      else if (
        container.webkitRequestFullscreen
      ) {

        container.webkitRequestFullscreen();

      }

    }

  } catch (e) {}


  try {

    if (
      screen.orientation &&
      screen.orientation.lock
    ) {

      await screen.orientation.lock(
        "landscape"
      );

    }

  } catch (e) {}

}


/* =====================================================
   MANUAL FULLSCREEN
   ===================================================== */

function toggleFullscreen() {

  const container =
    document.getElementById(
      "playerContainer"
    );


  if (!container) return;


  if (
    document.fullscreenElement
  ) {

    if (
      document.exitFullscreen
    ) {

      document.exitFullscreen();

    }

    return;

  }


  requestFullscreenAndLandscape();

}


/* =====================================================
   PAGES
   ===================================================== */

function togglePages(
  status
) {

  const loginPage =
    document.getElementById(
      "loginPage"
    );


  const content =
    document.getElementById(
      "channelsContent"
    );


  if (status) {

    loginPage.classList.add(
      "hidden"
    );

    content.classList.remove(
      "hidden"
    );

    document.body.style.justifyContent =

  }

  else {

    loginPage.classList.remove(
      "hidden"
    );

    content.classList.add(
      "hidden"
    );

    document.body.style.justifyContent =
      "center";

  }

}


/* =====================================================
   LOGIN
   ===================================================== */

function checkCode() {

  const input =
    document.getElementById(
      "passCodeInput"
    );


  const message =
    document.getElementById(
      "message"
    );


  if (
    input.value ===
    CORRECT_CODE
  ) {

    togglePages(true);

    message.textContent = "";

  else {

    message.textContent =
      "رمز المرور غير صحيح";

    input.value = "";

    input.focus();

  }

}


/* =====================================================
   SHARE
   ===================================================== */

function shareSite() {

  const shareData = {

    title:
      "GO TV MAX",

    text:
      "شاهد القنوات الرياضية مباشرة.",

    url:
      window.location.href

  };


  if (
    navigator.share
  ) {

    navigator.share(
      shareData
    ).catch(
      () => {}
    );

  }

  else if (
    navigator.clipboard
  ) {

    navigator.clipboard
      .writeText(
        shareData.url
      )
      .then(
        function() {

          alert(
            "تم نسخ رابط الموقع."
          );

        }
      );

  }

}

   FULLSCREEN CHANGE
   ===================================================== */

document.addEventListener(
  "fullscreenchange",
  function() {

    if (
      document.fullscreenElement
    ) {

      try {

        if (
          screen.orientation &&
          screen.orientation.lock
        ) {

          screen.orientation.lock(
            "landscape"
          ).catch(
            () => {}
          );

        }

      } catch (e) {}

    }

  }
);

   PAGE LOAD
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    togglePages(true);

    switchServer(
      activeServer
    );

  }
);

   CLEANUP
   ===================================================== */

  "beforeunload",
  function() {

    destroyPlayer();

  }
);
