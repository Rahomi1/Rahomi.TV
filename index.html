<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>📡 البث المباشر - GO TV MAX</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.css" />
  <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }

    body {
      background: #0b0e14;
      color: #eef2f6;
      min-height: 100vh;
      padding: 0 12px 20px;
    }

    .header {
      background: #141a24;
      border-radius: 16px;
      padding: 14px 18px;
      margin: 12px 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #2a3344;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 span {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header .status {
      font-size: 13px;
      color: #8896b0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.online {
      background: #34d399;
      box-shadow: 0 0 10px rgba(52,211,153,0.4);
    }

    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 10px rgba(239,68,68,0.4);
    }

    /* زر التليجرام */
    .telegram-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #229ED9;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(34,158,217,0.2);
    }

    .telegram-btn:hover {
      background: #168ac0;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(34,158,217,0.3);
    }

    .telegram-btn i {
      font-size: 18px;
    }

    .player-wrapper {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #2a3344;
      aspect-ratio: 16/9;
      width: 100%;
      max-height: 55vh;
      margin-bottom: 12px;
    }

    #artplayer-container {
      width: 100%;
      height: 100%;
    }

    .player-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: #141a24;
      border-radius: 12px;
      border: 1px solid #2a3344;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .player-info .now-playing {
      font-size: 14px;
      font-weight: 700;
      color: #b0bedb;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-info .now-playing .live-badge {
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 20px;
      animation: pulse-badge 1.5s infinite;
    }

    @keyframes pulse-badge {
      0%,100% { opacity: 1 }
      50% { opacity: 0.4 }
    }

    .player-info .fullscreen-btn {
      background: #2a3344;
      border: none;
      color: #b0bedb;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: #8896b0;
      margin: 10px 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .folders-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 12px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .folders-scroll::-webkit-scrollbar {
      height: 4px;
    }

    .folders-scroll::-webkit-scrollbar-thumb {
      background: #2a3344;
      border-radius: 10px;
    }

    .folder-card {
      flex: 0 0 120px;
      background: #141a24;
      border: 1px solid #2a3344;
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .folder-card:hover {
      background: #1e283a;
      border-color: #3b82f6;
    }

    .folder-card.active {
      background: rgba(59,130,246,0.15);
      border-color: #3b82f6;
      box-shadow: 0 0 20px rgba(59,130,246,0.1);
    }

    .folder-card .icon {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .folder-card .name {
      font-size: 12px;
      font-weight: 700;
      color: #b0bedb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-card .count {
      font-size: 10px;
      color: #4a5670;
      font-weight: 600;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 4px;
    }

    .channel-card {
      background: #141a24;
      border: 1px solid #2a3344;
      border-radius: 12px;
      padding: 10px 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .channel-card:hover {
      background: #1e283a;
      border-color: #3b82f6;
      transform: translateY(-2px);
    }

    .channel-card.active {
      border-color: #3b82f6;
      background: rgba(59,130,246,0.12);
    }

    .channel-card .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #0b0e14;
      border-radius: 8px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #4a5670;
      overflow: hidden;
    }

    .channel-card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
    }

    .channel-card .name {
      font-size: 12px;
      font-weight: 700;
      color: #b0bedb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      grid-column: 1/-1;
      text-align: center;
      padding: 40px 16px;
      color: #4a5670;
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 10px;
      opacity: 0.5;
    }

    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      gap: 10px;
      color: #4a5670;
    }

    .loader .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #2a3344;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #141a24;
      border: 1px solid #2a3344;
      color: #b0bedb;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {
      .channels-grid {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 8px;
      }

      .folder-card {
        flex: 0 0 100px;
        padding: 8px 6px;
      }

      .header h1 {
        font-size: 17px;
      }

      .telegram-btn {
        padding: 7px 11px;
        font-size: 12px;
      }

      .telegram-btn i {
        font-size: 16px;
      }
    }

    @media (max-width: 400px) {
      .channels-grid {
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      }

      .folder-card {
        flex: 0 0 85px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <h1>
      <i class="fa-solid fa-satellite-dish" style="color:#3b82f6;"></i>
      <span>بث مباشر</span>
    </h1>

    <!-- زر قناة التليجرام -->
    <a
      class="telegram-btn"
      href="https://t.me/GOTV_RI"
      target="_blank"
      rel="noopener noreferrer"
      title="قناة GO TV MAX على التليجرام"
    >
      <i class="fa-brands fa-telegram"></i>
      <span>قناة التليجرام</span>
    </a>

    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">جاري الاتصال...</span>
    </div>

  </header>

  <div class="player-wrapper">
    <div id="artplayer-container"></div>
  </div>

  <div class="player-info">
    <div class="now-playing">
      <span class="live-badge">مباشر</span>
      <span id="nowPlaying">اختر قناة للبدء</span>
    </div>

    <button class="fullscreen-btn" id="fullscreenBtn">
      <i class="fa-solid fa-expand"></i> تكبير
    </button>
  </div>

  <div class="section-label">
    <i class="fa-solid fa-folder" style="color:#f59e0b;"></i>
    الأقسام والملفات
    <span id="foldersCount" style="font-size:12px;color:#4a5670;margin-right:auto;"></span>
  </div>

  <div class="folders-scroll" id="foldersGrid">
    <div class="loader">
      <div class="spinner"></div>
      <span>جاري تحميل الأقسام...</span>
    </div>
  </div>

  <div class="section-label" style="margin-top:6px;">
    <i class="fa-solid fa-tv" style="color:#34d399;"></i>
    القنوات
    <span id="channelsCount" style="font-size:12px;color:#4a5670;margin-right:auto;"></span>
  </div>

  <div class="channels-grid" id="channelsGrid">
    <div class="empty-state">
      <div class="icon">📺</div>
      <div>اختر قسماً لعرض قنواته</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>

    const WORKER_URL = 'https://alyaassta.hsinnzaer5.workers.dev';

    const foldersGrid = document.getElementById('foldersGrid');
    const channelsGrid = document.getElementById('channelsGrid');
    const nowPlaying = document.getElementById('nowPlaying');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const foldersCount = document.getElementById('foldersCount');
    const channelsCount = document.getElementById('channelsCount');
    const toast = document.getElementById('toast');

    let art = null;
    let categories = [];
    let currentChannels = [];
    let toastTimer = null;

    // ================================================================
    // تهيئة ArtPlayer
    // ================================================================

    function initArtPlayer() {

      art = new Artplayer({
        container: '#artplayer-container',
        url: '',
        type: 'm3u8',
        isLive: true,
        autoplay: true,
        theme: '#3b82f6',
        volume: 0.8,
        fullscreen: true,
        fullscreenWeb: true,
        playsInline: true,
        lang: 'ar',

        customType: {

          m3u8: function(video, url, artInstance) {

            if (Hls.isSupported()) {

              if (artInstance.hls) {
                artInstance.hls.destroy();
              }

              const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: false
              });

              hls.loadSource(url);
              hls.attachMedia(video);

              artInstance.hls = hls;

              artInstance.on('destroy', () => {
                hls.destroy();
              });

            } else if (
              video.canPlayType('application/vnd.apple.mpegurl')
            ) {
              video.src = url;
            }

          }

        }

      });

      document
        .getElementById('fullscreenBtn')
        .addEventListener('click', () => {

          if (art) {
            art.fullscreenToggle();
          }

        });

    }

    // ================================================================
    // Toast
    // ================================================================

    function showToast(message, duration = 2500) {

      toast.textContent = message;
      toast.classList.add('show');

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, duration);

    }

    // ================================================================
    // جلب البيانات من Worker
    // ================================================================

    async function fetchFromWorker(path) {

      try {

        const url = `${WORKER_URL}${path}`;

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        return await response.json();

      } catch (error) {

        console.error('❌ خطأ في الجلب:', error);

        return null;

      }

    }

    // ================================================================
    // جلب الأقسام
    // ================================================================

    async function loadCategories() {

      statusText.textContent = 'جاري التحميل...';
      statusDot.className = 'status-dot offline';

      foldersGrid.innerHTML = `
        <div class="loader">
          <div class="spinner"></div>
          <span>جاري تحميل الأقسام...</span>
        </div>
      `;

      const data = await fetchFromWorker('/api/categories');

      let extractedCategories = [];

      if (data) {

        if (Array.isArray(data)) {

          extractedCategories = data;

        } else if (
          data.data &&
          Array.isArray(data.data)
        ) {

          extractedCategories = data.data;

        } else if (
          data.categories &&
          Array.isArray(data.categories)
        ) {

          extractedCategories = data.categories;

        } else if (
          data.بيانات &&
          typeof data.بيانات === 'object'
        ) {

          const obj = data.بيانات;
          const keys = Object.keys(obj);

          const skipKeys = [
            'عدد الأطفال',
            'الشعار',
            'name',
            'id',
            'title',
            'count',
            'children'
          ];

          for (const key of keys) {

            if (skipKeys.includes(key)) continue;

            if (
              typeof obj[key] === 'object' &&
              obj[key] !== null
            ) {

              extractedCategories.push({
                id: key,
                name: key,
                count: obj[key]?.count || 0,
                data: obj[key]
              });

            }

          }

        } else if (
          typeof data === 'object' &&
          !Array.isArray(data)
        ) {

          const keys = Object.keys(data);

          const skipKeys = [
            'عدد الأطفال',
            'الشعار',
            'name',
            'id',
            'title',
            'count',
            'children',
            'data'
          ];

          for (const key of keys) {

            if (skipKeys.includes(key)) continue;

            if (
              typeof data[key] === 'object' &&
              data[key] !== null
            ) {

              extractedCategories.push({
                id: key,
                name: key,
                count: data[key]?.count || 0,
                data: data[key]
              });

            }

          }

        }

      }

      categories = extractedCategories;

      foldersCount.textContent =
        `(${categories.length} قسم)`;

      if (categories.length === 0) {

        foldersGrid.innerHTML = `
          <div class="empty-state" style="min-width:200px;">
            <div class="icon">📂</div>
            <div>لا توجد أقسام متاحة</div>
            <div style="font-size:11px;margin-top:6px;color:#4a5670;">
              تأكد من أن الـ Worker يعيد بيانات صحيحة
            </div>
          </div>
        `;

        statusText.textContent = '❌ لا توجد أقسام';
        statusDot.className = 'status-dot offline';

        return;
      }

      foldersGrid.innerHTML = '';

      categories.forEach((cat, index) => {

        const card = document.createElement('div');

        card.className = 'folder-card';

        card.dataset.id = cat.id || index;

        const name =
          cat.name ||
          cat.title ||
          `قسم ${index + 1}`;

        const count =
          cat.count ||
          cat.channels_count ||
          '';

        card.innerHTML = `
          <div class="icon">📁</div>
          <div class="name">
            ${escapeHtml(name)}
          </div>

          ${
            count
              ? `<div class="count">${count} قناة</div>`
              : ''
          }
        `;

        card.addEventListener('click', () => {

          document
            .querySelectorAll('.folder-card')
            .forEach(el =>
              el.classList.remove('active')
            );

          card.classList.add('active');

          loadChannels(cat);

        });

        foldersGrid.appendChild(card);

      });

      statusText.textContent =
        `✅ ${categories.length} قسم`;

      statusDot.className =
        'status-dot online';

      if (categories.length > 0) {

        const firstCard =
          foldersGrid.querySelector('.folder-card');

        if (firstCard) {

          firstCard.classList.add('active');

          loadChannels(categories[0]);

        }

      }

    }

    // ================================================================
    // جلب القنوات
    // ================================================================

    async function loadChannels(category) {

      channelsGrid.innerHTML = `
        <div class="empty-state">
          <div class="loader"
            style="display:flex;justify-content:center;gap:10px;padding:10px;">
            <div class="spinner"></div>

            <span style="color:#4a5670;">
              جاري تحميل القنوات...
            </span>
          </div>
        </div>
      `;

      let channels = [];

      const paths = [

        `/api/categories/${category.id}/channels`,

        `/api/category/${category.id}/channels`,

        `/api/channels?category=${category.id}`,

        `/api/channels`

      ];

      for (const path of paths) {

        const data =
          await fetchFromWorker(path);

        if (data) {

          let extracted = [];

          if (Array.isArray(data)) {

            extracted = data;

          } else if (
            data.data &&
            Array.isArray(data.data)
          ) {

            extracted = data.data;

          } else if (
            data.channels &&
            Array.isArray(data.channels)
          ) {

            extracted = data.channels;

          }

          if (extracted.length > 0) {

            channels = extracted;

            break;

          }

        }

      }

      currentChannels = channels;

      channelsCount.textContent =
        `(${channels.length} قناة)`;

      if (channels.length === 0) {

        channelsGrid.innerHTML = `
          <div class="empty-state">

            <div class="icon">📺</div>

            <div>
              لا توجد قنوات في هذا القسم
            </div>

            <div style="font-size:11px;margin-top:6px;color:#4a5670;">
              قد تكون القنوات مخفية أو الـ Worker لا يعيدها
            </div>

          </div>
        `;

        return;
      }

      renderChannels(channels);

    }

    // ================================================================
    // عرض القنوات
    // ================================================================

    function renderChannels(channels) {

      channelsGrid.innerHTML = '';

      channels.forEach((ch, index) => {

        const card =
          document.createElement('div');

        card.className =
          'channel-card';

        card.dataset.id =
          ch.id || index;

        const name =
          ch.name ||
          ch.title ||
          `قناة ${index + 1}`;

        const logo =
          ch.logo ||
          ch.image ||
          ch.icon ||
          '';

        const streamUrl =
          ch.url ||
          ch.stream_url ||
          ch.link ||
          ch.file ||
          ch.source;

        card.innerHTML = `

          <div class="thumb">

            ${
              logo

              ? `<img
                  src="${escapeHtml(logo)}"
                  alt=""
                  loading="lazy"
                  onerror="this.style.display='none';this.parentElement.innerHTML='📡'"
                />`

              : '📡'
            }

          </div>

          <div class="name">
            ${escapeHtml(name)}
          </div>

        `;

        card.addEventListener('click', () => {

          document
            .querySelectorAll('.channel-card')
            .forEach(el =>
              el.classList.remove('active')
            );

          card.classList.add('active');

          playChannel(ch);

        });

        channelsGrid.appendChild(card);

      });

    }

    // ================================================================
    // تشغيل قناة
    // ================================================================

    async function playChannel(channel) {

      const name =
        channel.name ||
        channel.title ||
        'القناة';

      nowPlaying.textContent = name;

      if (!art) {

        showToast(
          '⚠️ المشغل لم يتم تهيئته بعد'
        );

        return;
      }

      let streamUrl =
        channel.url ||
        channel.stream_url ||
        channel.link ||
        channel.file ||
        channel.source;

      // إذا لم يكن هناك رابط، نحاول جلب تفاصيل القناة
      if (!streamUrl && channel.id) {

        showToast(
          '⏳ جاري البحث عن رابط البث...'
        );

        const data =
          await fetchFromWorker(
            `/api/channel/${encodeURIComponent(channel.id)}`
          );

        if (data) {

          let streams = [];

          if (Array.isArray(data)) {

            streams = data;

          } else if (
            data.data &&
            Array.isArray(data.data)
          ) {

            streams = data.data;

          } else if (
            data.servers &&
            Array.isArray(data.servers)
          ) {

            streams = data.servers;

          } else if (
            data.streams &&
            Array.isArray(data.streams)
          ) {

            streams = data.streams;

          } else if (
            data.url ||
            data.stream_url
          ) {

            streams = [data];

          }

          if (streams.length > 0) {

            const first = streams[0];

            streamUrl =
              first.url ||
              first.stream_url ||
              first.link ||
              first.file ||
              first.source;

          }

        }

      }

      if (!streamUrl) {

        showToast(
          `❌ لا يوجد رابط بث لـ ${name}`
        );

        art.notice.show =
          '⚠️ لا يوجد رابط بث';

        return;
      }

      streamUrl =
        streamUrl.replace(/\\\//g, '/');

      if (!streamUrl.startsWith('http')) {

        streamUrl =
          `${WORKER_URL}/?stream=${encodeURIComponent(streamUrl)}`;

      } else if (
        !streamUrl.includes('?stream=')
      ) {

        streamUrl =
          `${WORKER_URL}/?stream=${encodeURIComponent(streamUrl)}`;

      }

      try {

        art.notice.show =
          `⏳ جاري تشغيل: ${name}...`;

        art.switchUrl(streamUrl);

        art.play();

        showToast(
          `▶️ تشغيل: ${name}`
        );

      } catch (error) {

        console.error(
          '❌ فشل التشغيل:',
          error
        );

        art.notice.show =
          '❌ فشل تشغيل القناة';

        showToast(
          '❌ فشل تشغيل القناة'
        );

      }

    }

    // ================================================================
    // أدوات مساعدة
    // ================================================================

    function escapeHtml(text) {

      if (!text) return '';

      return String(text).replace(
        /[&<>"']/g,
        (char) => {

          const map = {

            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'

          };

          return map[char] || char;

        }
      );

    }

    // ================================================================
    // التشغيل
    // ================================================================

    document.addEventListener(
      'DOMContentLoaded',
      async () => {

        initArtPlayer();

        setTimeout(
          () => loadCategories(),
          300
        );

      }
    );

  </script>

</body>
</html>
