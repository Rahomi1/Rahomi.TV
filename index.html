    // ==================================================
    // CREATE CHANNEL CARD
    // ==================================================

    function createChannelCard(channel) {

      const fallbackSvg = `
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-6 h-6 text-${channel.color}-300"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect
            x="2"
            y="7"
            width="20"
            height="15"
            rx="2"
            ry="2"
          ></rect>

          <polyline points="17 2 12 7 7 2"></polyline>
        </svg>
      `;


      let logoContent;


      if (
        channel.logoUrl &&
        channel.logoUrl.trim() !== ''
      ) {

        logoContent = `
          <img
            src="${channel.logoUrl}"
            alt="${channel.name} logo"
            class="channel-logo-image"
            onerror="this.onerror=null; this.parentElement.innerHTML=this.parentElement.dataset.fallback;"
          >
        `;

      } else {

        logoContent = fallbackSvg;

      }


      return `
        <div
          onclick="playChannel(${channel.id}, '${channel.url}', '${channel.name}')"
          class="channel-card-clickable glass rounded-xl p-3 border border-slate-700/80 bg-slate-900/50"
          data-id="${channel.id}"
        >

          <div class="flex items-center gap-3">

            <div
              class="channel-logo-container bg-sky-500/20 flex items-center justify-center border border-sky-400/50"
              data-fallback='${fallbackSvg}'
            >
              ${logoContent}
            </div>

            <div class="flex flex-col flex-1 min-w-0">

              <span class="font-semibold text-base text-slate-50 truncate">
                ${channel.name}
              </span>

            </div>

          </div>

        </div>
      `;
    }


    // ==================================================
    // SWITCH SERVER
    // ==================================================

    function switchServer(serverId) {

      if (!CHANNELS[serverId]) return;

      activeServer = serverId;


      const channelListContainer =
        document.getElementById('channelList');


      const serverButtons =
        document.querySelectorAll('.server-button');


      serverButtons.forEach(btn => {

        btn.classList.remove(
          'server-button-active'
        );

        if (
          btn.dataset.serverId === serverId
        ) {

          btn.classList.add(
            'server-button-active'
          );

        }

      });


      channelListContainer.innerHTML = '';


      CHANNELS[serverId].forEach(channel => {

        channelListContainer.innerHTML +=
          createChannelCard(channel);

      });


      destroyPlayer();


      const playerContainer =
        document.getElementById(
          "playerContainer"
        );


      playerContainer.innerHTML = `
        <div
          id="playerPlaceholder"
          class="flex flex-col items-center gap-3 px-4 text-center"
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-8 h-8 text-sky-300"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >

            <circle
              cx="12"
              cy="12"
              r="9"
              stroke-width="1.4"
            ></circle>

            <path
              d="M10 9.5v5l4-2.5-4-2.5z"
              fill="currentColor"
              stroke-width="0.6"
              stroke="none"
            ></path>

          </svg>

          <div class="space-y-1">

            <p class="font-semibold text-slate-100">
              اضغط على اسم القناة لبدء المشاهدة.
            </p>

            <p class="text-sm text-slate-400">
              القناة الحالية:
              <span
                id="currentChannelLabel"
                class="font-semibold text-sky-300"
              >
                لم يتم الاختيار
              </span>
            </p>

          </div>

        </div>
      `;


      document.getElementById(
        "currentChannelLabel"
      ).textContent =
        'لم يتم الاختيار';


      document
        .querySelectorAll(
          '.channel-card-clickable'
        )
        .forEach(card =>
          card.classList.remove(
            'channel-card-active'
          )
        );
    }


    // ==================================================
    // DESTROY PLAYER
    // ==================================================

    function destroyPlayer() {

      if (bufferTimer) {

        clearInterval(
          bufferTimer
        );

        bufferTimer = null;

      }


      if (hlsInstance) {

        try {

          hlsInstance.stopLoad();

        } catch (e) {}

        hlsInstance.destroy();

        hlsInstance = null;

      }

    }


    // ==================================================
    // PAGES
    // ==================================================

    function togglePages(status) {

      const loginPage =
        document.getElementById(
          "loginPage"
        );

      const channelsContent =
        document.getElementById(
          "channelsContent"
        );


      if (status) {

        loginPage.classList.add(
          "hidden"
        );

        channelsContent.classList.remove(
          "hidden"
        );

        document.body.style.justifyContent =
          'flex-start';

      } else {

        loginPage.classList.remove(
          "hidden"
        );

        channelsContent.classList.add(
          "hidden"
        );

        document.body.style.justifyContent =
          'center';

      }

    }


    // ==================================================
    // WINDOW LOAD
    // ==================================================

    window.onload = function() {

      togglePages(true);

      switchServer(
        activeServer
      );

    };


    // ==================================================
    // FULLSCREEN
    // ==================================================

    function requestFullscreen(element) {

      const container =
        document.getElementById(
          "playerContainer"
        );


      if (
        container.requestFullscreen
      ) {

        container.requestFullscreen();

      }

      else if (
        element.webkitEnterFullscreen
      ) {

        element.webkitEnterFullscreen();

      }

      else if (
        element.webkitRequestFullscreen
      ) {

        element.webkitRequestFullscreen();

      }

      else if (
        container.webkitRequestFullscreen
      ) {

        container.webkitRequestFullscreen();

      }

    }


    // ==================================================
    // PLAYER UI
    // ==================================================

    function createPlayerUI() {

      const playerContainer =
        document.getElementById(
          "playerContainer"
        );


      playerContainer.innerHTML = `

        <video
          id="videoPlayer"
          controls

          webkit-playsinline
          preload="auto"
          x-webkit-airplay="allow"
        ></video>


        <div
          id="playerLoading"

    // ==================================================
    // LOADING
    // ==================================================

    function setLoading(
      status
    ) {

      const loading =
        document.getElementById(
          "playerLoading"
        );

      if (!loading) return;


      if (status) {

        loading.classList.add(
          "visible"
        );

      } else {

        loading.classList.remove(
          "visible"
        );

      }

    }


    // ==================================================
    // BUFFER MONITOR
    // ==================================================

    function startBufferMonitor(
      video
    ) {

      if (bufferTimer) {

        clearInterval(
          bufferTimer
        );

      }


      const statusBar =
        document.getElementById(
          "liveStatusBar"
        );


      const progress =
        document.getElementById(
          "bufferProgress"
        );


      const bufferText =
        document.getElementById(
          "bufferText"
        );


      if (!statusBar ||
          !progress ||
          !bufferText) {
        return;
      }


      statusBar.classList.add(
        "visible"
      );


      bufferTimer =
        setInterval(
          function() {

            if (
              !video ||
              video.readyState < 2
            ) {
              return;
            }


            let bufferedSeconds = 0;


            try {

              const currentTime =
                video.currentTime;


              const ranges =
                video.buffered;


              for (
                let i = 0;
                i < ranges.length;
                i++
              ) {

                const start =
                  ranges.start(i);

                const end =
                  ranges.end(i);


                if (
                  currentTime >= start &&
                  currentTime <= end
                ) {

                  bufferedSeconds =
                    Math.max(
                      0,
                      end - currentTime
                    );

                  break;
                }

              }

            } catch (e) {}


            const displaySeconds =
              Math.round(
                bufferedSeconds
              );


            bufferText.textContent =
              `Buffer: ${displaySeconds}s`;


            /*
             * عرض بصري من 0 إلى 30 ثانية.
             * لا يؤثر على البث نفسه.
             */

            const percent =
              Math.min(
                100,
                (bufferedSeconds / 30) * 100
              );


            progress.style.width =
              percent + "%";


            if (
              bufferedSeconds < 3
            ) {

              progress.style.background =
                "#ef4444";

            }

            else if (
              bufferedSeconds < 8
            ) {

              progress.style.background =
                "#f59e0b";

            }

            else {

              progress.style.background =
                "#38bdf8";

            }

          },
          500
        );
    }


    // ==================================================
    // PLAY CHANNEL
    // ==================================================

    function playChannel(
      id,
      m3u8Url,
      name
    ) {

      const originalUrl =
        m3u8Url;


      const channelLabel =
        document.getElementById(
          "currentChannelLabel"
        );


      if (
        !originalUrl ||
        originalUrl === ''
      ) {

        alert(
          'لا يوجد رابط بث لهذه القناة حالياً.'
        );

        return;

      }


      // ================================================
      // CLEAN OLD PLAYER
      // ================================================

      destroyPlayer();


      // ================================================
      // CREATE NEW PLAYER
      // ================================================

      createPlayerUI();


      const videoElement =
        document.getElementById(
          "videoPlayer"
        );


      if (!videoElement) {
        return;
      }


      setLoading(true);


      // ================================================
      // HLS.JS
      // ================================================

      if (
        Hls.isSupported()
      ) {

        hlsInstance =
          new Hls({

            debug: false,


            /*
             * ==========================================
             * BUFFER
             * ==========================================
             *
             * نستخدم Buffer أكبر للبث المباشر
             * لتقليل التقطيع عند ضعف الشبكة.
             */

            maxBufferLength: 30,

            maxMaxBufferLength: 45,

            backBufferLength: 30,


            /*
             * ==========================================
             * LIVE
             * ==========================================
             */

            lowLatencyMode: false,

            liveSyncDurationCount: 4,

            liveMaxLatencyDurationCount: 10,

            maxLiveSyncPlaybackRate: 1.05,


            /*
             * ==========================================
             * FRAGMENT
             * ==========================================
             */

            maxFragLookUpTolerance: 0.25,

            maxLoadingDelay: 4,


            /*
             * ==========================================
             * BANDWIDTH / ABR
             * ==========================================
             */

            abrEwmaFastLive: 3,

            abrEwmaSlowLive: 9,

            abrBandWidthFactor: 0.75,

            abrBandWidthUpFactor: 0.70,


            /*
             * ==========================================
             * RETRY
             * ==========================================
             *
             * إعادة المحاولة فقط عند الحاجة.
             */

            manifestLoadingMaxRetry: 4,

            levelLoadingMaxRetry: 4,

            fragLoadingMaxRetry: 4,

            manifestLoadingRetryDelay: 1000,

            levelLoadingRetryDelay: 1000,

            fragLoadingRetryDelay: 1000,


            /*
             * ==========================================
             * PERFORMANCE
             * ==========================================
             */

            enableWorker: true,

            capLevelToPlayerSize: true,

            startLevel: -1

          });


        // ==============================================
        // LOAD
        // ==============================================

        hlsInstance.loadSource(
          originalUrl
        );


        hlsInstance.attachMedia(
          videoElement
        );


        // ==============================================
        // MANIFEST
        // ==============================================

        hlsInstance.on(
          Hls.Events.MANIFEST_PARSED,
          function() {

            setLoading(false);


            startBufferMonitor(
              videoElement
            );


            videoElement
              .play()
              .then(() => {

                /*
                 * محاولة Fullscreen
                 * كما في الكود الأصلي.
                 */

                try {

                  requestFullscreen(
                    videoElement
                  );

                } catch (e) {}

              })
              .catch(
                function(error) {

                  console.log(
                    'تم منع التشغيل التلقائي:',
                    error
                  );

                }
              );

          }
        );


        // ==============================================
        // BUFFER APPENDED
        // ==============================================

        hlsInstance.on(
          Hls.Events.BUFFER_APPENDED,
          function() {

            if (
              videoElement.readyState >= 3
            ) {

              setLoading(false);

            }

          }
        );


        // ==============================================
        // FRAG LOADED
        // ==============================================

        hlsInstance.on(
          Hls.Events.FRAG_LOADED,
          function() {

            setLoading(false);

          }
        );


        // ==============================================
        // ERROR HANDLER
        // ==============================================

        hlsInstance.on(
          Hls.Events.ERROR,
          function(
            event,
            data
          ) {

            console.log(
              "HLS:",
              data.type,
              data.details,
              "fatal:",
              data.fatal
            );


            // ------------------------------------------
            // NETWORK
            // ------------------------------------------

            if (
              data.fatal &&
              data.type ===
              Hls.ErrorTypes.NETWORK_ERROR
            ) {

              console.log(
                "Network error - إعادة تحميل HLS"
              );


              setLoading(true);


              /*
               * لا ندمر المشغل.
               * فقط نوقف التحميل لحظيًا ثم نعيده.
               */

              setTimeout(
                function() {

                  if (
                    hlsInstance
                  ) {

                    hlsInstance.startLoad();

                  }

                },
                800
              );


              return;
            }


            // ------------------------------------------
            // MEDIA
            // ------------------------------------------

            if (
              data.fatal &&
              data.type ===
              Hls.ErrorTypes.MEDIA_ERROR
            ) {

              console.log(
                "Media error - recovery"
              );


              try {

                hlsInstance.recoverMediaError();

              } catch (e) {

                console.log(
                  e
                );

              }


              return;
            }


            // ------------------------------------------
            // OTHER FATAL ERROR
            // ------------------------------------------

            if (
              data.fatal
            ) {

              console.log(
                "Fatal HLS error"
              );


              setLoading(true);


              setTimeout(
                function() {

                  if (
                    hlsInstance
                  ) {

                    try {

                      hlsInstance.destroy();

                    } catch (e) {}


                    hlsInstance = null;


                    /*
                     * إعادة تشغيل القناة
                     * مرة واحدة من خلال نفس الرابط.
                     */

                    playChannel(
                      id,
                      originalUrl,
                      name
                    );

                  }

                },
                1500
              );

            }

          }
        );


        // ==============================================
        // STALLED
        // ==============================================

        videoElement.addEventListener(
          "stalled",
          function() {

            setLoading(true);

          }
        );


        // ==============================================
        // WAITING
        // ==============================================

        videoElement.addEventListener(
          "waiting",
          function() {

            setLoading(true);

          }
        );


        // ==============================================
        // PLAYING
        // ==============================================

        videoElement.addEventListener(
          "playing",
          function() {

            setLoading(false);

          }
        );


        // ==============================================
        // CAN PLAY
        // ==============================================

        videoElement.addEventListener(
          "canplay",
          function() {

            setLoading(false);

          }
        );


      }


      // ================================================
      // SAFARI / IOS
      // ================================================

      else if (
        videoElement.canPlayType(
          'application/vnd.apple.mpegurl'
        )
      ) {

        videoElement.src =
          originalUrl;


        videoElement.addEventListener(
          'loadedmetadata',
          function() {

            setLoading(false);


            startBufferMonitor(
              videoElement
            );


            videoElement
              .play()
              .then(() => {

                try {

                  requestFullscreen(
                    videoElement
                  );

                } catch (e) {}

              })
              .catch(
                function(error) {

                  console.log(
                    'تم منع التشغيل التلقائي:',
                    error
                  );

                }
              );

          }
        );


        videoElement.addEventListener(
          "waiting",
          function() {

            setLoading(true);

          }
        );


        videoElement.addEventListener(
          "playing",
          function() {

            setLoading(false);

          }
        );

      }


      else {

        setLoading(false);

        alert(
          "هذا المتصفح لا يدعم تشغيل HLS."
        );

        return;

      }


      // ================================================
      // CHANNEL LABEL
      // ================================================

      if (channelLabel) {

        channelLabel.textContent =
          name;

      }


      // ================================================
      // ACTIVE CARD
      // ================================================

      const allChannelCards =
        document.querySelectorAll(
          '.channel-card-clickable'
        );


      allChannelCards.forEach(
        card =>
          card.classList.remove(
            'channel-card-active'
          )
      );


      const clickedCard =
        Array.from(
          allChannelCards
        ).find(
          card =>
            card.dataset.id == id
        );


      if (clickedCard) {

        clickedCard.classList.add(
          'channel-card-active'
        );

      }

    }


    // ==================================================
    // SHARE
    // ==================================================

    function shareSite() {

      const shareData = {

        title:
          'GO TV MAX',

        text:
          'شاهد القنوات الرياضية مباشرة.',

        url:
          window.location.href

      };


      if (
        navigator.share
      ) {

        navigator.share(
          shareData
        )
        .catch(
          error =>
            console.log(
              'Error sharing',
              error
            )
        );

      } else {

        navigator.clipboard
          .writeText(
            shareData.url
          )
          .then(
            () => {

              alert(
                `تم نسخ رابط الموقع بنجاح! شاركه لتعم الفائدة: ${shareData.url}`
              );

            }
          );

      }

    }

  </script></body>
</html>
