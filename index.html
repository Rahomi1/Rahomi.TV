<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GO TV MAX</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #0b0f14;
      color: #fff;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 15px 20px;
      background: #111820;
      border-bottom: 1px solid #26313d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
    }

    .logo span {
      color: #e50914;
    }

    .telegram-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 15px;
      border-radius: 10px;
      background: #229ed9;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
    }

    .telegram-btn:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .telegram-btn i {
      font-size: 20px;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: auto;
      padding: 20px;
    }

    /* Player */
    .player-box {
      width: 100%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #27313b;
      margin-bottom: 20px;
    }

    #player {
      width: 100%;
      height: 55vh;
      min-height: 280px;
      max-height: 700px;
    }

    .player-info {
      background: #111820;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .now-playing {
      color: #ddd;
      font-size: 15px;
      font-weight: bold;
    }

    /* Categories */
    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0 12px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }

    .categories::-webkit-scrollbar {
      height: 5px;
    }

    .categories::-webkit-scrollbar-thumb {
      background: #394552;
      border-radius: 10px;
    }

    .category-btn {
      border: 1px solid #303b47;
      background: #151d26;
      color: #ddd;
      padding: 10px 17px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 14px;
      transition: 0.2s;
    }

    .category-btn:hover {
      background: #202b36;
    }

    .category-btn.active {
      background: #e50914;
      border-color: #e50914;
      color: #fff;
    }

    /* Channels */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
      margin-top: 15px;
    }

    .channel-card {
      background: #151d26;
      border: 1px solid #283440;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s;
      min-height: 150px;
      display: flex;
      flex-direction: column;
    }

    .channel-card:hover {
      transform: translateY(-3px);
      border-color: #e50914;
    }

    .channel-card.active {
      border-color: #e50914;
      box-shadow: 0 0 0 1px #e50914;
    }

    .channel-image {
      width: 100%;
      height: 105px;
      background: #0e141b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .channel-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }

    .channel-name {
      padding: 11px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      line-height: 1.4;
    }

    .loading,
    .empty,
    .error {
      width: 100%;
      text-align: center;
      padding: 35px 15px;
      color: #aaa;
    }

    .error {
      color: #ff6b6b;
    }

    .loading i {
      margin-left: 7px;
    }

    @media (max-width: 700px) {
      header {
        padding: 12px;
      }

      .logo {
        font-size: 20px;
      }

      .telegram-btn {
        padding: 8px 10px;
        font-size: 12px;
      }

      .telegram-btn span {
        display: none;
      }

      .telegram-btn i {
        font-size: 21px;
      }

      .container {
        padding: 12px;
      }

      #player {
        height: 35vh;
        min-height: 220px;
      }

      .channels-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .channel-image {
        height: 90px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      GO <span>TV</span> MAX
    </div>

    <a
      class="telegram-btn"
      href="https://t.me/GOTV_RI"
      target="_blank"
      rel="noopener noreferrer"
      title="قناة GO TV MAX على التليجرام"
    >
      <i class="fa-brands fa-telegram"></i>
      <span>قناة التليجرام</span>
    </a>
  </header>

  <main class="container">

    <!-- Player -->
    <div class="player-box">

      <div id="player"></div>

      <div class="player-info">
        <span class="now-playing" id="nowPlaying">
          قم باختيار قناة لتشغيلها
        </span>
      </div>

    </div>

    <!-- Categories -->
    <div class="section-title">
      الأقسام
    </div>

    <div id="categories" class="categories">
      <div class="loading">
        <i class="fa-solid fa-spinner fa-spin"></i>
        جاري تحميل الأقسام...
      </div>
    </div>

    <!-- Channels -->
    <div class="section-title">
      القنوات
    </div>

    <div id="channelsGrid" class="channels-grid">
      <div class="loading">
        <i class="fa-solid fa-spinner fa-spin"></i>
        جاري تحميل القنوات...
      </div>
    </div>

  </main>

  <!-- HLS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- ArtPlayer -->
  <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>

  <script>

    const API_BASE =
      "https://alyaassta.hsinnzaer5.workers.dev";

    let art = null;
    let hls = null;

    let categories = [];
    let currentCategory = null;

    const categoriesContainer =
      document.getElementById("categories");

    const channelsGrid =
      document.getElementById("channelsGrid");

    const nowPlaying =
      document.getElementById("nowPlaying");


    /*
     * إنشاء المشغل
     */
    art = new Artplayer({
      container: "#player",

      autoplay: false,

      muted: false,

      volume: 0.8,

      fullscreen: true,

      setting: true,

      pip: true,

      screenshot: false,

      playbackRate: true,

      aspectRatio: true,

      autoSize: false,

      theme: "#e50914",

      customType: {
        m3u8: function(video, url) {

          if (Hls.isSupported()) {

            if (hls) {
              hls.destroy();
              hls = null;
            }

            hls = new Hls({
              enableWorker: true,

              lowLatencyMode: true,

              backBufferLength: 90,

              maxBufferLength: 30,

              maxMaxBufferLength: 60
            });

            hls.loadSource(url);

            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function() {
              video.play().catch(() => {});
            });

            hls.on(Hls.Events.ERROR, function(event, data) {

              if (data.fatal) {

                switch (data.type) {

                  case Hls.ErrorTypes.NETWORK_ERROR:
                    hls.startLoad();
                    break;

                  case Hls.ErrorTypes.MEDIA_ERROR:
                    hls.recoverMediaError();
                    break;

                  default:
                    hls.destroy();
                    break;
                }
              }

            });

          } else if (
            video.canPlayType("application/vnd.apple.mpegurl")
          ) {

            video.src = url;

            video.addEventListener(
              "loadedmetadata",
              function() {
                video.play().catch(() => {});
              }
            );

          }

        }
      }
    });


    /*
     * جلب الأقسام
     */
    async function loadCategories() {

      categoriesContainer.innerHTML = `
        <div class="loading">
          <i class="fa-solid fa-spinner fa-spin"></i>
          جاري تحميل الأقسام...
        </div>
      `;

      try {

        const response =
          await fetch(`${API_BASE}/api/categories`);

        if (!response.ok) {
          throw new Error("فشل تحميل الأقسام");
        }

        categories = await response.json();

        if (!Array.isArray(categories)) {
          throw new Error("بيانات الأقسام غير صحيحة");
        }

        renderCategories();

        /*
         * تحميل أول قسم فقط.
         * لا يتم تشغيل أي قناة تلقائيًا.
         */
        if (categories.length > 0) {
          loadChannels(categories[0]);
        } else {
          channelsGrid.innerHTML = `
            <div class="empty">
              لا توجد أقسام متاحة
            </div>
          `;
        }

      } catch (error) {

        console.error(error);

        categoriesContainer.innerHTML = `
          <div class="error">
            تعذر تحميل الأقسام
          </div>
        `;

        channelsGrid.innerHTML = `
          <div class="error">
            تعذر تحميل القنوات
          </div>
        `;
      }
    }


    /*
     * عرض الأقسام
     */
    function renderCategories() {

      categoriesContainer.innerHTML = "";

      categories.forEach((category, index) => {

        const button =
          document.createElement("button");

        button.className =
          "category-btn";

        if (index === 0) {
          button.classList.add("active");
        }

        button.textContent =
          getCategoryName(category);

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".category-btn")
              .forEach(btn =>
                btn.classList.remove("active")
              );

            button.classList.add("active");

            loadChannels(category);
          }
        );

        categoriesContainer.appendChild(button);
      });
    }


    /*
     * الحصول على اسم القسم
     */
    function getCategoryName(category) {

      if (typeof category === "string") {
        return category;
      }

      return (
        category.name ||
        category.title ||
        category.category ||
        category.label ||
        "قسم"
      );
    }


    /*
     * جلب القنوات
     */
    async function loadChannels(category) {

      currentCategory = category;

      channelsGrid.innerHTML = `
        <div class="loading">
          <i class="fa-solid fa-spinner fa-spin"></i>
          جاري تحميل القنوات...
        </div>
      `;

      try {

        const categoryName =
          getCategoryName(category);

        let response = null;

        /*
         * محاولة استخدام endpoint الخاص بالأقسام
         */
        const endpoints = [

          `${API_BASE}/api/channels?category=${encodeURIComponent(categoryName)}`,

          `${API_BASE}/api/channels/${encodeURIComponent(categoryName)}`,

          `${API_BASE}/api/category/${encodeURIComponent(categoryName)}`

        ];

        for (const endpoint of endpoints) {

          try {

            const res =
              await fetch(endpoint);

            if (res.ok) {

              const data =
                await res.json();

              if (Array.isArray(data)) {

                response = data;
                break;

              }

              if (
                data &&
                Array.isArray(data.channels)
              ) {

                response = data.channels;
                break;

              }

            }

          } catch (e) {
            console.log("Endpoint failed:", endpoint);
          }
        }


        if (!response) {
          throw new Error("تعذر الحصول على القنوات");
        }


        renderChannels(response);


      } catch (error) {

        console.error(error);

        channelsGrid.innerHTML = `
          <div class="error">
            تعذر تحميل القنوات
          </div>
        `;
      }
    }


    /*
     * عرض القنوات
     */
    function renderChannels(channels) {

      channelsGrid.innerHTML = "";

      if (!channels || channels.length === 0) {

        channelsGrid.innerHTML = `
          <div class="empty">
            لا توجد قنوات في هذا القسم
          </div>
        `;

        return;
      }


      channels.forEach(channel => {

        const card =
          document.createElement("div");

        card.className =
          "channel-card";


        const image =
          getChannelImage(channel);

        const name =
          getChannelName(channel);


        card.innerHTML = `
          <div class="channel-image">

            ${
              image
              ? `
                <img
                  src="${escapeHtml(image)}"
                  alt="${escapeHtml(name)}"
                  loading="lazy"
                  onerror="this.style.display='none'"
                >
              `
              : `
                <i
                  class="fa-solid fa-tv"
                  style="font-size:35px;color:#555"
                ></i>
              `
            }

          </div>

          <div class="channel-name">
            ${escapeHtml(name)}
          </div>
        `;


        card.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".channel-card")
              .forEach(item =>
                item.classList.remove("active")
              );

            card.classList.add("active");

            playChannel(channel);
          }
        );


        channelsGrid.appendChild(card);

      });

    }


    /*
     * اسم القناة
     */
    function getChannelName(channel) {

      if (typeof channel === "string") {
        return channel;
      }

      return (
        channel.name ||
        channel.title ||
        channel.channel_name ||
        channel.label ||
        "قناة"
      );
    }


    /*
     * صورة القناة
     */
    function getChannelImage(channel) {

      if (typeof channel === "string") {
        return "";
      }

      return (
        channel.logo ||
        channel.image ||
        channel.img ||
        channel.icon ||
        channel.thumbnail ||
        ""
      );
    }


    /*
     * استخراج رابط القناة
     */
    function getChannelUrl(channel) {

      if (typeof channel === "string") {
        return channel;
      }

      return (
        channel.url ||
        channel.stream ||
        channel.stream_url ||
        channel.link ||
        channel.m3u8 ||
        channel.src ||
        ""
      );
    }


    /*
     * تشغيل القناة
     */
    function playChannel(channel) {

      const streamUrl =
        getChannelUrl(channel);

      const channelName =
        getChannelName(channel);


      if (!streamUrl) {

        nowPlaying.textContent =
          "رابط القناة غير متوفر";

        return;
      }


      nowPlaying.textContent =
        `يتم تشغيل: ${channelName}`;


      /*
       * رابط الـ Worker
       */
      const proxiedUrl =
        `${API_BASE}/?stream=${encodeURIComponent(streamUrl)}`;


      try {

        art.switchUrl(proxiedUrl);

        art.play();

      } catch (error) {

        console.error(
          "Player error:",
          error
        );

        nowPlaying.textContent =
          "تعذر تشغيل القناة";
      }

    }


    /*
     * حماية النصوص عند إضافتها إلى HTML
     */
    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /*
     * بدء تحميل الموقع
     */
    loadCategories();

  </script>

</body>
</html>
